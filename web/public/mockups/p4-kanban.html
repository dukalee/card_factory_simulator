<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검수 4. 다크 칸반 보드</title><link rel="stylesheet" href="prod.css"><style>.panel{background:#0f1722;border-color:#223347;color:#e6edf6}.bar{display:flex;align-items:center;gap:16px;padding:14px 20px;background:#16212f;border-bottom:1px solid #223347}
.bar .cur{display:flex;gap:14px;align-items:center;margin-right:auto}.bar h3{margin:0;font-size:15px}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#223347}
.col{background:#0f1722;padding:14px;min-height:300px}.col h4{margin:0 0 12px;font-size:13px;letter-spacing:.1em;display:flex;justify-content:space-between}.col .w{display:flex;flex-wrap:wrap;gap:10px}
.col.a h4{color:#7dd3fc}.col.p h4{color:#4ade80}.col.f h4{color:#f87171}.k{border:2px solid transparent;background:none;padding:3px;border-radius:8px;cursor:pointer}.k.sel{border-color:#38bdf8;box-shadow:0 0 14px #38bdf8}.mc .st{display:none}</style></head><body>
<a class="back" href="index.html">← 시안 목록</a><div class="cap">검수 4. 다크 칸반 보드 — 미검수 / 합격 / 불량 3열. 카드를 누르면 상단 검수 바에서 판정하면 해당 열로 이동</div><div class="panel" id="root"></div><script src="prod.js"></script><script>function render(){const c=S.cur();const col=(t,cl,f)=>`<div class="col ${cl}"><h4><span>${t}</span><span>${S.cards.filter(f).length}</span></h4><div class="w">${S.cards.filter(f).map(x=>`<button class="k ${x.name==S.sel?'sel':''}" onclick="pick('${x.name}')">${card(x,72)}</button>`).join('')}</div></div>`;
root.innerHTML=`<div class="bar"><div class="cur">${card(c,54)}<div><h3>${c.name}</h3><span class="mute">${c.v?(c.v=='pass'?'합격 처리됨':'불량 처리됨'):'판정 대기'}</span></div></div>${c.v?'':`<button class="btn b-ok" onclick="judge('pass')">합격</button><button class="btn b-err" onclick="judge('fail')">불량</button>`}</div>
<div class="cols">${col('미검수','a',x=>!x.v)}${col('합격','p',x=>x.v=='pass')}${col('불량','f',x=>x.v=='fail')}</div>`} render();</script></body></html>
