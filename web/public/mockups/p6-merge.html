<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검수 6. 검수대 + 확대경 (2+5)</title><link rel="stylesheet" href="prod.css"><style>
.hd{display:flex;align-items:center;gap:22px;padding:14px 22px;border-bottom:1px solid #eef1f6;font-size:14px}.hd h2{margin:0 auto 0 0;font-size:16px}.hd b{font-size:20px;margin-left:6px}
.prog{height:8px;display:flex;background:#eef1f6}.prog i{display:block;height:100%;transition:width .3s}
.stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:24px;padding:26px 28px;background:radial-gradient(circle at 50% 35%,#fff,#e3e9f2)}
.big{border-radius:16px;font-size:26px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.big small{font-size:12px;font-weight:600;opacity:.8;letter-spacing:0}.big:disabled{opacity:.35;cursor:not-allowed}
.mid{text-align:center;position:relative}.lp{position:absolute;right:-8px;top:-8px;z-index:3;font-size:12px;color:#667;background:#fff;border-radius:999px;padding:4px 10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 28px;border-top:1px solid #eef1f6;background:#fff}
.chk label{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #dde3ee;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px}.chk input{width:17px;height:17px}
.strip{display:flex;gap:10px;padding:16px 20px;overflow-x:auto;background:#1f2937;border-top:6px solid #374151}.f{border:2px solid transparent;border-radius:8px;padding:3px;background:none;cursor:pointer}.f.sel{border-color:#38bdf8;box-shadow:0 0 12px #38bdf8}
</style></head><body>
<a class="back" href="index.html">← 시안 목록</a><div class="cap">검수 6. 검수대 + 확대경 (2+5) — 가운데 큰 카드, 좌우 대형 판정 버튼, 체크리스트, 하단 필름스트립</div><div class="panel" id="root"></div><script src="prod.js"></script><script>
function render(){const k=S.cnt(),c=S.cur(),d=!!c.v;root.innerHTML=`<div class="hd"><h2>생산 · 카드 검수</h2><span>생산<b>${k.n}</b></span><span>합격<b class="ok">${k.p}</b></span><span>불량<b class="err">${k.f}</b></span><span>미검수<b>${k.u}</b></span></div>
<div class="prog"><i style="width:${k.p/k.n*100}%;background:#16a34a"></i><i style="width:${k.f/k.n*100}%;background:#dc2626"></i></div>
<div class="stage"><button class="btn big b-ok" ${d?'disabled':''} onclick="judge('pass')">✔ 합격<small>정상 카드</small></button>
<div class="mid">${card(c,270)}<span class="lp">🔍 ${c.name}${d?' · '+(c.v=='pass'?'합격':'불량')+' 처리됨':''}</span></div>
<button class="btn big b-err" ${d?'disabled':''} onclick="judge('fail')">✖ 불량<small>불량 카드</small></button></div>
<div class="chk">${['잉크 인쇄 색상','홀로그램 시트','보안 마킹(로고)','커팅 위치'].map(t=>`<label><input type="checkbox" checked>${t}</label>`).join('')}</div>
<div class="strip">${S.cards.map(x=>`<button class="f ${x.name==S.sel?'sel':''}" onclick="pick('${x.name}')">${card(x,64)}</button>`).join('')}</div>`}
render();</script></body></html>
