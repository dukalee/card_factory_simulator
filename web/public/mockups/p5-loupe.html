<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검수 5. 확대경 + 체크리스트</title><link rel="stylesheet" href="prod.css"><style>.wrap{display:grid;grid-template-columns:340px 1fr}.view{background:radial-gradient(circle at 50% 40%,#fff,#dfe6f0);padding:28px;display:flex;justify-content:center;align-items:center;position:relative}
.view .lp{position:absolute;right:14px;top:14px;font-size:12px;color:#667;background:#fff;border-radius:999px;padding:4px 10px}.right{padding:22px;display:flex;flex-direction:column;gap:14px}
.prog{height:8px;border-radius:99px;background:#eef1f6;overflow:hidden;display:flex}.prog i{display:block;height:100%}.chk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk label{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #dde3ee;border-radius:10px;cursor:pointer;font-weight:700}.chk input{width:18px;height:18px}
.row{display:flex;gap:10px}.row .btn{flex:1;padding:14px}.mini{display:flex;gap:6px;flex-wrap:wrap}.mini button{border:2px solid transparent;border-radius:6px;background:none;padding:2px;cursor:pointer}.mini .sel{border-color:#2563eb}</style></head><body>
<a class="back" href="index.html">← 시안 목록</a><div class="cap">검수 5. 확대경 + 체크리스트 — 카드를 크게 확대해 보며 항목(인쇄 · 홀로 · 로고 · 커팅)을 체크한 뒤 판정. 한 장씩 집중해서 검사하는 흐름</div><div class="panel" id="root"></div><script src="prod.js"></script><script>function render(){const k=S.cnt(),c=S.cur();root.innerHTML=`<div class="wrap"><div class="view">${card(c,260)}<span class="lp">🔍 ${c.name}</span></div><div class="right"><div><b style="font-size:16px">카드 검수</b> <span class="mute">${k.p+k.f} / ${k.n}</span></div>
<div class="prog"><i style="width:${k.p/k.n*100}%;background:#16a34a"></i><i style="width:${k.f/k.n*100}%;background:#dc2626"></i></div>
<div class="chk">${['잉크 인쇄 색상','홀로그램 시트','보안 마킹(로고)','커팅 위치'].map(t=>`<label><input type="checkbox" checked>${t}<span class="mute" style="margin-left:auto;font-weight:400">이상 없음</span></label>`).join('')}</div>
${c.v?`<b class="${c.v=='pass'?'ok':'err'}">${c.v=='pass'?'합격 처리됨':'불량 처리됨'}</b>`:`<div class="row"><button class="btn b-ok" onclick="judge('pass')">합격 처리</button><button class="btn b-err" onclick="judge('fail')">불량 처리</button></div>`}
<div class="mini">${S.cards.map(x=>`<button class="${x.name==S.sel?'sel':''}" onclick="pick('${x.name}')">${card(x,36)}</button>`).join('')}</div></div></div>`} render();</script></body></html>
