<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검수 1. 좌 목록 · 우 상세</title><link rel="stylesheet" href="prod.css"><style>.top{display:flex;gap:10px;padding:16px 20px;border-bottom:1px solid #eef1f6;align-items:center}.top h2{margin:0 auto 0 0;font-size:16px}
.kp{padding:6px 14px;border-radius:999px;background:#f1f4f9;font-size:13px}.kp b{margin-left:6px;font-size:16px}
.body{display:grid;grid-template-columns:1fr 300px}.grid{display:flex;flex-wrap:wrap;gap:12px;padding:20px;align-content:flex-start}
.t{background:none;border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;text-align:center;font-size:11px;color:#667}.t.sel{border-color:#2563eb;background:#eff5ff}
.side{background:#f7f9fc;border-left:1px solid #eef1f6;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}.row{display:flex;gap:10px;width:100%}.row .btn{flex:1}</style></head><body>
<a class="back" href="index.html">← 시안 목록</a><div class="cap">검수 1. 좌 목록 · 우 상세 — 기존 구조를 다듬은 안: 상단 KPI 칩, 좌측 썸네일 그리드, 우측 큰 카드와 합격/불량 버튼</div><div class="panel" id="root"></div><script src="prod.js"></script><script>function render(){const k=S.cnt(),c=S.cur();root.innerHTML=`<div class="top"><h2>생산 · 카드 검수</h2><span class="kp">생산<b>${k.n}</b></span><span class="kp">합격<b class="ok">${k.p}</b></span><span class="kp">불량<b class="err">${k.f}</b></span><span class="kp">미검수<b>${k.u}</b></span></div>
<div class="body"><div class="grid">${S.cards.map(x=>`<button class="t ${x.name==S.sel?'sel':''}" onclick="pick('${x.name}')">${card(x,70)}<br>${x.name.replace('card_','#')}</button>`).join('')}</div>
<div class="side">${card(c,230)}<b>${c.name}</b>${c.v?`<span class="${c.v=='pass'?'ok':'err'}">${c.v=='pass'?'합격 처리됨':'불량 처리됨'}</span>`:`<div class="row"><button class="btn b-ok" onclick="judge('pass')">합격</button><button class="btn b-err" onclick="judge('fail')">불량</button></div>`}</div></div>`} render();</script></body></html>
