<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검수 3. MES 표 + 인스펙터</title><link rel="stylesheet" href="prod.css"><style>.layout{display:grid;grid-template-columns:1fr 280px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f1f4f9;text-align:left;padding:10px 14px;color:#667;font-weight:700}
td{padding:7px 14px;border-bottom:1px solid #eef1f6}tr{cursor:pointer}tr.sel td{background:#eff5ff}tr:hover td{background:#f7f9fc}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}.bd.pass{background:#dcfce7;color:#15803d}.bd.fail{background:#fee2e2;color:#b91c1c}.bd.none{background:#eef1f6;color:#667}
.ins{border-left:1px solid #eef1f6;padding:20px;background:#f7f9fc;display:flex;flex-direction:column;gap:12px;align-items:center}.kk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;text-align:center;font-size:11px;color:#667}.kk b{display:block;font-size:20px;color:#1d2433}
.row{display:flex;gap:8px;width:100%}.row .btn{flex:1}</style></head><body>
<a class="back" href="index.html">← 시안 목록</a><div class="cap">검수 3. MES 표 + 인스펙터 — 표 형태 목록(상태 뱃지)과 우측 인스펙터. 많은 카드를 빠르게 훑는 데 유리</div><div class="panel" id="root"></div><script src="prod.js"></script><script>function render(){const k=S.cnt(),c=S.cur();root.innerHTML=`<div class="layout"><div style="max-height:520px;overflow:auto"><table><tr><th></th><th>카드</th><th>타입</th><th>홀로</th><th>상태</th></tr>${S.cards.map(x=>`<tr class="${x.name==S.sel?'sel':''}" onclick="pick('${x.name}')"><td>${card(x,26)}</td><td>${x.name}</td><td>${x.key}</td><td>${x.holo?'●':'—'}</td><td><span class="bd ${x.v||'none'}">${x.v?x.v=='pass'?'합격':'불량':'미검수'}</span></td></tr>`).join('')}</table></div>
<div class="ins"><div class="kk"><span><b>${k.n}</b>생산</span><span><b class="ok">${k.p}</b>합격</span><span><b class="err">${k.f}</b>불량</span><span><b>${k.u}</b>미검수</span></div>${card(c,200)}<b>${c.name}</b>${c.v?`<span class="${c.v=='pass'?'ok':'err'}">${c.v=='pass'?'합격 처리됨':'불량 처리됨'}</span>`:`<div class="row"><button class="btn b-ok" onclick="judge('pass')">합격</button><button class="btn b-err" onclick="judge('fail')">불량</button></div>`}</div></div>`} render();</script></body></html>
