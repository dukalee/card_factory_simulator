<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검수 2. 검수대 + 필름스트립</title><link rel="stylesheet" href="prod.css"><style>.stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:28px;background:linear-gradient(180deg,#f4f7fb,#fff)}
.big{height:200px;border-radius:16px;font-size:26px;letter-spacing:.05em}.stage .btn:disabled{opacity:.35;cursor:not-allowed}
.hd{display:flex;justify-content:center;gap:28px;padding:14px;border-bottom:1px solid #eef1f6;font-size:14px}.hd b{font-size:20px;margin-left:6px}
.strip{display:flex;gap:10px;padding:16px 20px;overflow-x:auto;background:#1f2937;border-top:6px solid #374151}.f{border:2px solid transparent;border-radius:8px;padding:3px;background:none;cursor:pointer}.f.sel{border-color:#38bdf8;box-shadow:0 0 12px #38bdf8}</style></head><body>
<a class="back" href="index.html">← 시안 목록</a><div class="cap">검수 2. 검수대 + 필름스트립 — 큰 카드를 가운데 놓고 좌우에 합격/불량 대형 버튼, 아래에는 컨베이어를 따라 흐르는 카드 줄</div><div class="panel" id="root"></div><script src="prod.js"></script><script>function render(){const k=S.cnt(),c=S.cur(),d=!!c.v;root.innerHTML=`<div class="hd"><span>생산<b>${k.n}</b></span><span>합격<b class="ok">${k.p}</b></span><span>불량<b class="err">${k.f}</b></span><span>미검수<b>${k.u}</b></span></div>
<div class="stage"><button class="btn big b-ok" ${d?'disabled':''} onclick="judge('pass')">✔ 합격</button><div style="text-align:center">${card(c,250)}<div style="margin-top:10px"><b>${c.name}</b></div></div><button class="btn big b-err" ${d?'disabled':''} onclick="judge('fail')">✖ 불량</button></div>
<div class="strip">${S.cards.map(x=>`<button class="f ${x.name==S.sel?'sel':''}" onclick="pick('${x.name}')">${card(x,64)}</button>`).join('')}</div>`} render();</script></body></html>
