<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>혼합 3 — 투톤 (상단 다크 / 하단 라이트)</title>
<link rel="stylesheet" href="hybrid.css">
<style>
.hero{background:radial-gradient(1200px 300px at 50% -10%,#16314b,#0b1118);color:#c9d8e6;padding:0 0 26px;border-bottom:4px solid #1d3a56;--panel:#111b26;--panel2:#0e1822;--line:#22384d;--txt:#c9d8e6;--mute:#6d869c;--ring-bg:#1c2c3d;--ring-in:#0e1822;--bg:#0b1118}
.bar2{display:flex;align-items:center;gap:16px;padding:12px 28px}
.bar2 h1{font-size:15px;letter-spacing:.12em;color:var(--cyan)}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--mute)}
.line{position:relative;padding:20px 28px 0}
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;position:relative;z-index:1}
.st{background:rgba(14,24,34,.85)}
.drops{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:0 28px;height:22px}
.drops i{justify-self:center;width:3px;height:100%;background:repeating-linear-gradient(#38bdf8 0 4px,transparent 4px 8px);opacity:.6}
.beltwrap{padding:0 28px}.beltwrap .belt{height:34px;border-radius:17px}.beltwrap .cd{top:5px;width:20px;height:24px}
.lower{background:#eef1f5;color:#1d2433;padding:22px 28px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;
 --panel:#fff;--panel2:#f6f8fc;--line:#dfe4ec;--txt:#1d2433;--mute:#7a8599;--ring-bg:#e6eaf1;--ring-in:#fff;--bg:#eef1f5}
.lower .box{box-shadow:0 6px 18px rgba(30,50,90,.08)}
.ctl{display:flex;gap:10px;align-items:center;margin-left:auto}
</style></head><body style="background:#eef1f5">
<div class="hero">
  <div class="bar2"><h1>CARD FACTORY · LINE-01</h1><div class="tower h"><i class="r"></i><i></i><i></i></div><span class="chip">MODE AUTO</span><span class="chip mono clk">--:--:--</span>
    <div class="ctl"><button class="btn go">▶ START</button><button class="btn stop">■ STOP</button><button class="btn es">E-STOP</button></div></div>
  <div class="line"><div class="stations" id="st"></div></div>
  <div class="drops"><i></i><i></i><i></i><i></i></div>
  <div class="beltwrap" id="belt"></div>
</div>
<div class="lower">
  <div class="box"><h2><span>알람</span><span style="color:var(--err)">● 2 활성</span></h2><div id="al"></div></div>
  <div class="box"><h2><span>오늘의 생산 · 검수</span><span>12 / 20</span></h2><div class="pad"><div id="kv"></div><div style="height:12px"></div><div id="th"></div></div></div>
  <div class="box"><h2><span>Cut 정비 (PW)</span><span>🔒</span></h2><div class="pad" id="kp"></div></div>
</div>
<script src="hybrid.js"></script>
<script>fill('st',S.map((s,i)=>stRing(s,i,96)).join(''));fill('belt',belt());fill('kv',kv());fill('th',thumbs());fill('al',alarms());fill('kp',keypad());</script>
</body></html>
