*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:'Segoe UI','Malgun Gothic',sans-serif;overflow:hidden}
.back{position:fixed;left:14px;top:12px;z-index:50;font-size:12px;color:#fff;text-decoration:none;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px}

.grid{position:absolute;left:-50%;right:-50%;bottom:0;height:52%;background:

.sub{max-width:640px;color:#b5cde2;font-size:17px;line-height:1.7;text-shadow:0 2px 10px #000,0 0 18px #05060f}
