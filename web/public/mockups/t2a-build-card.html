<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타이틀 2-A. 카드가 완성되는 라인</title><link rel="stylesheet" href="prod.css"><style>@font-face{font-family:'Orbitron';font-weight:900;src:url('/node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2') format('woff2')}
@font-face{font-family:'Orbitron';font-weight:700;src:url('/node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2') format('woff2')}
*{box-sizing:border-box}html,body{margin:0;height:100%;padding:0}body{font-family:'Segoe UI','Malgun Gothic',sans-serif;overflow:hidden;background:radial-gradient(1200px 600px at 50% -10%,#16314b,#0b1118);color:#cfe6fa}
.back{position:fixed;left:14px;top:12px;z-index:50;font-size:12px;color:#fff;text-decoration:none;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px}
.ft{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:12px;letter-spacing:.05em;z-index:5;color:#4b6580}
.go{border:0;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-weight:800;font-size:20px;padding:16px 44px;border-radius:12px;cursor:pointer;box-shadow:0 8px 24px rgba(34,197,94,.4);animation:gp 2.6s ease-in-out infinite}
.go:hover{filter:brightness(1.1)}
@keyframes gp{50%{box-shadow:0 8px 34px rgba(34,197,94,.75)}}
.lk{color:#7dd3fc;font-size:14px}

.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 24px 250px}
.tag{font:700 13px Orbitron;letter-spacing:.4em;color:#7dd3fc;opacity:.85}
h1{margin:0;font:900 clamp(30px,4.6vw,62px)/1.1 Orbitron,sans-serif;letter-spacing:.1em;color:#38bdf8;text-shadow:0 0 18px rgba(56,189,248,.5)}
.sub{max-width:620px;color:#9db4c8;font-size:17px;line-height:1.7}
.line{position:fixed;left:0;right:0;bottom:0;height:250px}
.ms{position:absolute;bottom:116px;display:flex;flex-direction:column;align-items:center;gap:8px;width:170px;margin-left:-85px}
.ms i{display:block;width:130px;height:84px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#27465f,#162a3c);border:1px solid #3b5a78;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.5);transition:box-shadow .2s,border-color .2s}
.ms i b{position:absolute;top:10px;left:10px;width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.ms.act i{border-color:#38bdf8;box-shadow:0 0 28px rgba(56,189,248,.8)}
.ms span{font:700 12px Orbitron;letter-spacing:.12em;color:#9db4c8}
.ms small{color:#6b8aa6;font-size:12px}
.belt{position:absolute;left:0;right:0;bottom:56px;height:30px;background:repeating-linear-gradient(90deg,#2b3345 0 22px,#3a455c 22px 26px);animation:bl .6s linear infinite;border-top:3px solid #52708a}
@keyframes bl{to{background-position:26px 0}}
.pc{position:absolute;bottom:86px;left:0;width:56px;height:78px;border-radius:7px;background:#e5e7eb;border:3px solid #9ca3af;box-shadow:0 5px 12px rgba(0,0,0,.55);transition:background .3s,border-color .3s,box-shadow .3s;z-index:3;overflow:hidden}
.pc .art{position:absolute;left:5px;right:5px;top:14px;height:30px;border-radius:4px;background:#d1d5db;transition:background .3s}
.pc u{position:absolute;left:5px;right:5px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);text-decoration:none}
.pc u:nth-of-type(1){top:50px}.pc u:nth-of-type(2){top:58px;right:20px}
.pc .hs{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,rgba(120,200,255,.4) 55%,transparent 70%);opacity:0;transition:opacity .3s}
.pc .lg{position:absolute;left:5px;bottom:3px;font:900 7px Orbitron;color:#ffcb05;-webkit-text-stroke:2px #2a5ea8;paint-order:stroke fill;opacity:0;transition:opacity .3s}
.pc .ok{position:absolute;right:3px;top:2px;font-size:11px;color:#16a34a;opacity:0;transition:opacity .3s}
.pc.s1,.pc.s2,.pc.s3,.pc.s4{border-color:var(--bd);background:#fff7e0}
.pc.s1 .art,.pc.s2 .art,.pc.s3 .art,.pc.s4 .art{background:linear-gradient(135deg,var(--a1),var(--a2))}
.pc.s2 .hs,.pc.s3 .hs,.pc.s4 .hs{opacity:1}
.pc.s3 .lg,.pc.s4 .lg{opacity:1}
.pc.s4{box-shadow:0 0 18px var(--a1),0 5px 12px rgba(0,0,0,.55)}.pc.s4 .ok{opacity:1}
.stage{position:fixed;left:0;right:0;bottom:26px;text-align:center;font:700 13px 'Segoe UI','Malgun Gothic',sans-serif;letter-spacing:.15em;color:#7dd3fc;z-index:4;height:18px}
html,body{padding:0}</style></head><body>

<div class="c"><div class="tag">PRODUCTION LINE SIMULATION</div><h1>CARD FACTORY<br>SIMULATOR</h1>
<div class="sub">빈 카드가 4단계 공정을 지나 완성되는 과정을 감시하고,<br>이상이 생긴 머신을 복구해 정상 카드 10장을 가장 빨리 합격 처리하세요.</div>
<button class="go">▶ 시뮬레이터 시작</button><a class="lk" href="#">카드 갤러리 보기</a></div>
<div class="line" id="line">
<div class="ms" data-x="16"><i><b></b></i><span>1 · INK</span><small>잉크 프린팅</small></div>
<div class="ms" data-x="38"><i><b></b></i><span>2 · HOLO</span><small>홀로그램 부착</small></div>
<div class="ms" data-x="62"><i><b></b></i><span>3 · LOGO</span><small>보안 마킹</small></div>
<div class="ms" data-x="84"><i><b></b></i><span>4 · CUT</span><small>커팅</small></div>
<div class="belt"></div></div>
<div class="stage" id="stage"></div>
<div class="ft" style="bottom:2px">© 2026 aishift. All rights reserved.</div>
<script src="prod.js"></script><script>const PAL=[['#ef4444','#f59e0b','#b91c1c'],['#3b82f6','#06b6d4','#1d4ed8'],['#22c55e','#a3e635','#15803d'],['#eab308','#f97316','#a16207'],['#a855f7','#ec4899','#7e22ce'],['#6366f1','#0ea5e9','#4338ca']];
const line=document.getElementById('line'),N=7,els=[];
for(let i=0;i<N;i++){const p=PAL[i%PAL.length];const d=document.createElement('div');d.className='pc s0';d.style.cssText=`--a1:${p[0]};--a2:${p[1]};--bd:${p[2]}`;d.innerHTML='<i class="art"></i><u></u><u></u><span class="hs"></span><b class="lg">POOKIMON</b><span class="ok">✔</span>';line.appendChild(d);els.push(d)}
const ms=[...document.querySelectorAll('.ms')],names=['잉크 프린팅 중','홀로그램 부착 중','보안 마킹 중','커팅 중'];ms.forEach(m=>m.style.left=m.dataset.x+'%');
const SPEED=0.008,GAP=100/N;let t0=performance.now();
function tick(now){const W=innerWidth;const t=(now-t0)*SPEED/100;let act=-1;
els.forEach((e,i)=>{let pos=((t*100+ i*GAP)%(100+8))-4; e.style.left=(pos/100*W-28)+'px';
 const st=[16,38,62,84].filter(x=>pos>x+4).length; e.className='pc s'+st;
 [16,38,62,84].forEach((x,k)=>{if(Math.abs(pos-x)<4) act=k})});
ms.forEach((m,k)=>m.classList.toggle('act',k===act));
document.getElementById('stage').textContent=act>=0?'● '+names[act]:'';
requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></body></html>
