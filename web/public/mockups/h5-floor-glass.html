<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>혼합 5 — 공장 바닥 뷰 + 글래스 UI</title>
<link rel="stylesheet" href="hybrid.css">
<style>
body{background:radial-gradient(900px 500px at 50% 0,#173a5c,#08111b 70%);overflow-x:hidden;min-height:100vh}
.hd{display:flex;align-items:center;gap:14px;padding:14px 26px}
.hd h1{font-size:15px;letter-spacing:.14em;color:#9fd8ff}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:16px}
.floorwrap{perspective:1100px;padding:10px 26px 0;height:470px;position:relative}
.beltpos{position:absolute;left:26px;right:346px;top:378px;z-index:2}
.beltpos .belt{height:30px;box-shadow:0 10px 18px rgba(0,0,0,.5)}
.floor{position:absolute;left:1%;right:calc(1% + 320px);top:200px;height:300px;transform:rotateX(52deg);transform-origin:50% 100%;border-radius:24px;
 background:linear-gradient(rgba(56,189,248,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.14) 1px,transparent 1px),linear-gradient(#10263a,#0a1622);background-size:48px 48px,48px 48px,100% 100%;border:1px solid rgba(56,189,248,.25)}
.floor .belt{position:absolute;left:3%;right:3%;top:50%;height:34px;transform:translateY(-50%)}
.stations{position:absolute;left:26px;right:26px;top:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.st{background:rgba(14,24,34,.82);backdrop-filter:blur(6px);box-shadow:0 22px 30px rgba(0,0,0,.45)}
.st:nth-child(even){margin-top:34px}
.toasts{position:absolute;right:26px;top:6px;width:300px;z-index:5;display:grid;gap:8px}
.toast{padding:10px 12px;border-radius:12px;font-size:12px;background:rgba(40,12,16,.85);border:1px solid rgba(239,68,68,.55);color:#ffc9ca;display:flex;gap:10px;align-items:center}
.toast.w{background:rgba(45,32,6,.85);border-color:rgba(245,158,11,.55);color:#ffe0a3}
.dock{position:relative;z-index:3;margin:0 326px 26px 26px;flex-wrap:wrap;padding:14px 18px;display:flex;align-items:center;gap:20px}
.dock .th{flex-basis:60px}.dock .th img{width:60px;height:84px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:300px;z-index:10;background:rgba(10,18,28,.94);border-left:1px solid var(--line);padding:18px;transform:translateX(0);box-shadow:-20px 0 40px rgba(0,0,0,.5)}
.drawer h3{font-size:14px;margin-bottom:4px}.drawer small{color:var(--mute)}
.acts{display:grid;gap:8px;margin-top:12px}.acts .btn{text-align:left}
</style></head><body>
<div class="hd"><h1>CARD FACTORY · FLOOR VIEW</h1><div class="tower h"><i class="r"></i><i></i><i></i></div><span class="sp"></span><span class="mono clk" style="color:var(--mute)">--:--:--</span></div>
<div class="floorwrap"><div class="floor"></div><div class="beltpos" id="belt"></div>
  <div class="stations" id="st"></div></div>
<div class="dock glass"><div id="kv" style="width:380px"></div><div id="th"></div><span class="sp"></span>
  <button class="btn go">▶ START</button><button class="btn stop">■ STOP</button><button class="btn es">E-STOP</button></div>
<div class="drawer"><h3>🔧 Cut 정비 패널</h3><small>비밀번호 인증 후 컨트롤 활성화</small><div style="margin-top:14px" id="kp"></div>
  <div class="acts"><button class="btn" disabled>위치 조정</button><button class="btn" disabled>윤활</button><button class="btn" disabled>정비</button></div>
  <div style="margin-top:16px" class="box"><h2><span>Event Log</span></h2><div id="log"></div></div></div>
<div class="toasts"><div class="toast"><span class="sev e">CRIT</span>Cut · 이물질 감지 / 위치 이탈</div><div class="toast w"><span class="sev w">WARN</span>Holo · 윤활 부족 (15s)</div></div>
<script src="hybrid.js"></script>
<script>fill('st',S.map((s,i)=>stRing(s,i,90)).join(''));fill('belt',belt());fill('kv',kv());fill('th',thumbs());fill('kp',keypad());fill('log',log());
document.getElementById('st').style.right='346px';document.querySelector('.toasts').style.right='326px';</script>
</body></html>
